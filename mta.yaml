_schema-version: 3.3.0
ID: cpi-ai-platform
description: A simple CAP project.
version: 1.0.0
modules:
- name: cpi-ai-platform-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: cpi-ai-platform-auth
  - name: cpi-ai-platform-db
  - name: cpi-ai-platform-connectivity
  - name: cpi-ai-platform-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: cpi-ai-platform-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: cpi-ai-platform-db
  parameters:
    buildpack: nodejs_buildpack
- name: cpi-ai-platform-approuter
  type: approuter.nodejs
  path: cpi-ai-platform-approuter
  requires:
  - name: cpi-ai-platform_html_repo_runtime
  - name: cpi-ai-platform-auth
  - name: cpi-ai-platform-destination
    group: destinations
    properties:
      forwardAuthToken: false
      name: ui5
      url: https://ui5.sap.com
  parameters:
    disk-quota: 256M
    memory: 256M
- name: cpi-ai-platform_ui_deployer
  type: com.sap.application.content
  path: .
  requires:
  - name: cpi-ai-platform_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - iflowstudio.zip
      name: iflowstudio
      target-path: resources/
- name: iflowstudio
  type: html5
  path: app/iflowstudio
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: cpi-ai-platform-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: cpi-ai-platform-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: cpi-ai-platform-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: cpi-ai-platform-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
- name: cpi-ai-platform-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
    service: destination
    service-plan: lite
- name: cpi-ai-platform_html_repo_runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: cpi-ai-platform_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
